name: Validate project

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test counting and annotations
        run: npm test
      - name: Verify generated artifacts
        run: npm run check
      - name: Verify static graph
        run: npm run check:export
      - name: Validate assignment structure
        run: npm run validate
      - name: Check whitespace
        run: git diff --check
